---
name: Test and lint
permissions:
    contents: read
on:
    push:
    merge_group:
    schedule:
        - cron: 0 13 * * 1
    #pull_request:
    workflow_dispatch:
    repository_dispatch:
        types: [trigger_checks]

jobs:
    lint:
        name: Format, lint, and type check
        runs-on: ubuntu-26.04-arm
        env:
            RUFF_OUTPUT_FORMAT: github
            UV_FROZEN: 1
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true

            - name: Install artistools[extras]
              run: |
                  uv sync
                  uv pip install .

            - name: Run Ruff
              if: always()
              run: |
                  uv run -- ruff --version
                  uv run -- ruff check --exit-non-zero-on-fix --no-fix

            - name: Run Ruff Format
              if: always()
              run: uv run -- ruff format --check --exit-non-zero-on-format

            - name: Run pyrefly
              if: always()
              run: uv run -- pyrefly check

            - name: Run ty
              if: always()
              run: uv run -- ty check

            - name: Run prek pre-commit checks
              uses: j178/prek-action@v3.0.0

    pytest:
        timeout-minutes: 120
        strategy:
            fail-fast: false
            matrix:
                python-version: ['3.13', '3.14', 3.14t, '3.15', 3.15t]
        runs-on: ubuntu-26.04${{ !endsWith(matrix.python-version, 't') && '-arm' || '' }}
        env:
            UV_FROZEN: 1

        name: pytest python ${{ matrix.python-version }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup uv
              uses: astral-sh/setup-uv@v7
              with:
                  activate-environment: true
                  python-version: ${{ matrix.python-version }}

            - name: Install pynonthermal
              run: |
                  uv sync
                  uv pip install --compile-bytecode .

            - name: Test with pytest
              run: uv run -- python3 -m pytest --cov --cov-report=xml

            - name: Report coverage
              run: uv run -- python3 -m coverage report

            - name: Upload coverage artifact
              if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
              uses: actions/upload-artifact@v7
              with:
                  name: coverage-report-python
                  path: coverage.xml

    upload-coverage-python:
        needs: pytest
        if: ${{ !cancelled() && needs.pytest.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name
            == github.repository) }}
        runs-on: ubuntu-latest
        permissions:
            contents: read
            code-quality: write
            pull-requests: read
        steps:
            - name: Download coverage artifact
              uses: actions/download-artifact@v8
              with:
                  name: coverage-report-python

            - name: Check for a pull request associated with this commit
              id: haspr
              if: github.ref != 'refs/heads/main'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: echo "found=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'length > 0')" >> "$GITHUB_OUTPUT"

            - uses: actions/upload-code-coverage@v1
              if: github.ref == 'refs/heads/main' || steps.haspr.outputs.found == 'true'
              with:
                  file: coverage.xml
                  language: Python
                  label: code-coverage-agent
                  # the upload returns 404 until code coverage is enabled for the repository, which
                  # should not fail an otherwise passing test run
                  fail-on-error: false
