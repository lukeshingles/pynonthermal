---
name: Build and deploy to PyPI/testPyPI
permissions:
    contents: read
on:
    push:
    merge_group:
    release:
        types: [published, edited]
    repository_dispatch:
        types: [trigger_checks]
    workflow_dispatch:

jobs:
    build:
        name: Build distributions
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Setup uv
              uses: astral-sh/setup-uv@v7

            - name: Install dependencies
              run: |
                  python3 -m pip install --upgrade uv setuptools_scm
                  echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_PYNONTHERMAL=$(python3 -m setuptools_scm --strip-dev)" >> $GITHUB_ENV

            - name: Build
              run: |
                  uv build --sdist --wheel

            - name: Check that the wheel runs outside the checkout
              env:
                  MPLBACKEND: Agg
              run: |
                  wheel="$(ls "$PWD"/dist/*.whl)"
                  cd "$RUNNER_TEMP"
                  uv run --isolated --no-project --with "$wheel" -- python -c 'import pynonthermal; sf = pynonthermal.SpencerFanoSolver(npts=200); sf.add_element(Z=8, ion_densities={2: 1e8}); sf.solve(deposition_ev_per_s_per_cm3=1e8)'

            - uses: actions/upload-artifact@v7
              with:
                  name: dist-sdist-wheel
                  path: |
                      dist/*.tar.gz
                      dist/*.whl

    testdeploy:
        name: Test upload to TestPyPI
        needs: [build]
        runs-on: ubuntu-26.04
        environment: test
        permissions:
            id-token: write
        if: startsWith(github.ref , 'refs/tags/v') != true
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to TestPyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true
                  verbose: false
                  repository-url: https://test.pypi.org/legacy/

    deploy:
        name: Upload to PyPI
        needs: [build]
        runs-on: ubuntu-26.04
        environment: release
        permissions:
            id-token: write
        if: startsWith(github.ref, 'refs/tags/v')
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: dist-*
                  path: dist
                  merge-multiple: true

            - name: Publish package to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  skip-existing: true
                  verbose: false
